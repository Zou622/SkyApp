{% extends 'main.html' %}

{% block contenu %}
<div class="content-wrapper">
    <div class="container-fluid py-5">
        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card shadow">
                    <div class="card-header bg-danger text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-exclamation-triangle me-2"></i> Confirmation de suppression
                        </h4>
                    </div>
                    <div class="card-body text-center">
                        <div class="mb-4">
                            <i class="fas fa-trash fa-4x text-danger mb-3"></i>
                            <h3 class="text-danger">Attention !</h3>
                            <p class="lead">Confirmez la suppression définitive du client suivant :</p>
                        </div>

                        <div class="alert alert-danger py-4">
                            <h5 class="mb-1">{{ client.nom_client }}</h5>
                            <small class="text-muted">ID: #{{ client.id }}</small>
                        </div>

                        <form method="post">
                            {% csrf_token %}
                            <div class="d-flex justify-content-center gap-3">
                                <a href="{% url 'clients:list_client' %}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-1"></i> Annuler
                                </a>
                                <button type="submit" class="btn btn-danger">
                                    <i class="fas fa-trash me-1"></i> Supprimer définitivement
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock contenu %}
