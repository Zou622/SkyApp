{% extends 'main.html' %}
{% load static %}

{% block contenu %}
<div class="content-wrapper">
    <div class="container mt-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="fas fa-user-plus me-2"></i> Ajouter un Nouveau Client
                </h4>
            </div>

            <div class="card-body">
                <!-- Message d'information -->
                <div id="dedieMessage" class="alert alert-info" style="display: none;">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>Contrat Symétrique :</strong> Download et Upload = Capacité
                </div>

                <form method="post" action="{% url 'clients:enregistrer_client' %}" enctype="multipart/form-data" id="clientForm">
                    {% csrf_token %}

                    <div class="row">

                        <!-- ===================== COLONNE 1 ===================== -->
                        <div class="col-md-6">
                            <h5 class="border-bottom pb-2 mb-3 text-primary">
                                <i class="fas fa-user me-2"></i> Informations Client
                            </h5>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Nom client *</label>
                                <input type="text" class="form-control" name="nom_client" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">Adresse</label>
                                    <textarea class="form-control" name="adresse"></textarea>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Quartier</label>
                                    <input type="text" class="form-control" name="quartier">
                                </div>
                            </div>

                            <div class="row mt-2">
                                <div class="col-md-6">
                                    <label class="form-label">Téléphone</label>
                                    <input type="text" class="form-control" name="telephone">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" name="email">
                                </div>
                            </div>

                            <div class="row mt-2">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Type de contrat </label>
                                    <select class="form-control" name="type_contrat_id" id="typeContrat">
                                        <option value="">--- Sélectionner ---</option>
                                        {% for type in type_contrats %}
                                            <option value="{{ type.id }}">{{ type.nom }}</option>
                                        {% endfor %}
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Statut *</label>
                                    <select class="form-control" name="statut" required>
                                        <option value="">--- Sélectionner ---</option>
                                        <option value="non_actif">Non activé</option>
                                        <option value="actif">Activé</option>
                                        <option value="suspendu">Suspendu</option>
                                        <option value="resilie">Résilié</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mt-3">
                                <label class="form-label fw-bold">Commercial</label>
                                <select class="form-control" name="commercial_id">
                                    <option value="">-- Sélectionner --</option>
                                    {% for commercial in commerciaux %}
                                        <option value="{{ commercial.id }}">{{ commercial.prenom }} {{ commercial.nom }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- ===================== COLONNE 2 ===================== -->
                        <div class="col-md-6">
                            <h5 class="border-bottom pb-2 mb-3 text-primary">
                                <i class="fas fa-network-wired me-2"></i> Informations Techniques
                            </h5>

                            <!-- 🔥 NOUVEAU CHAMP FORFAIT -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Forfait
                                </label>
                                <select class="form-control" name="forfait" id="forfaitSelect">
                                    <option value="">--- Sélectionner un forfait ---</option>
                                    <option value="dedié">Dedié</option>
                                    <option value="partagé">Partagé</option>
                                </select>
                                <small class="text-muted">Sélectionnez le forfait souscrit par le client</small>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <label class="form-label">Adresse IP</label>
                                    <input type="text" class="form-control" name="adresse_ip">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">VLAN</label>
                                    <input type="text" class="form-control" name="vlan">
                                </div>
                            </div>

                            <!-- BASE STATION -->
                            <div class="mt-3">
                                <label class="form-label fw-bold">Base Station</label>
                                <select class="form-control" name="base_station">
                                    <option value="">--- Sélectionner ---</option>
                                    {% for station in base_stations %}
                                        <option value="{{ station.id }}">{{ station.nom }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="mt-3">
                                <label class="form-label fw-bold">Capacité (Mbps)</label>
                                <input type="number" class="form-control" name="capacite" id="capacite" placeholder="Ex: 100">
                            </div>

                            <div class="row mt-2">
                                <div class="col-md-6">
                                    <label>Download (Mbps)</label>
                                    <input type="number" class="form-control" name="download" id="download" placeholder="Ex: 100">
                                </div>
                                <div class="col-md-6">
                                    <label>Upload (Mbps)</label>
                                    <input type="number" class="form-control" name="upload" id="upload" placeholder="Ex: 50">
                                </div>
                            </div>

                            <div class="mt-3">
                                <label>Contrat PDF</label>
                                <input type="file" class="form-control" name="contrat_pdf">
                            </div>
                        </div>
                    </div>

                    <!-- ===================== BOUTONS ===================== -->
                    <div class="mt-4 d-flex justify-content-between">
                        <a href="{% url 'clients:list_client' %}" class="btn btn-secondary">Retour</a>
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript pour pré-remplir capacité/download/upload selon le forfait -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const forfaitSelect = document.getElementById('forfaitSelect');
    const capaciteInput = document.getElementById('capacite');
    const downloadInput = document.getElementById('download');
    const uploadInput = document.getElementById('upload');
    const typeContrat = document.getElementById('typeContrat');
    const dedieMessage = document.getElementById('dedieMessage');

    // Mapping des forfaits
    const forfaitMapping = {
        '10 Mbps': 10,
        '20 Mbps': 20,
        '30 Mbps': 30,
        '50 Mbps': 50,
        '100 Mbps': 100,
        '200 Mbps': 200,
        '500 Mbps': 500,
        '1 Gbps': 1000
    };

    // Fonction pour mettre à jour les champs
    function updateForfaitFields() {
        const selectedForfait = forfaitSelect.value;
        
        if (selectedForfait && forfaitMapping[selectedForfait]) {
            const valeur = forfaitMapping[selectedForfait];
            capaciteInput.value = valeur;
            
            // Vérifier le type de contrat
            const contratValue = typeContrat.value;
            const contratText = typeContrat.options[typeContrat.selectedIndex]?.text;
            
            if (contratText && contratText.toLowerCase().includes('symétrique')) {
                // Pour un contrat symétrique
                downloadInput.value = valeur;
                uploadInput.value = valeur;
                dedieMessage.style.display = 'block';
            } else {
                // Pour un contrat asymétrique ou non spécifié
                downloadInput.value = valeur;
                uploadInput.value = Math.floor(valeur / 2); // Upload = moitié de la capacité
                dedieMessage.style.display = 'none';
            }
        }
    }

    // Écouter les changements sur le forfait
    forfaitSelect.addEventListener('change', updateForfaitFields);
    
    // Écouter les changements sur le type de contrat
    typeContrat.addEventListener('change', function() {
        if (forfaitSelect.value) {
            updateForfaitFields();
        }
        
        // Afficher/masquer le message pour contrat dédié
        const selectedText = typeContrat.options[typeContrat.selectedIndex]?.text;
        if (selectedText && selectedText.toLowerCase().includes('symétrique')) {
            dedieMessage.style.display = 'block';
        } else {
            dedieMessage.style.display = 'none';
        }
    });
});
</script>

<!-- Style optionnel -->
<style>
    .form-control:focus {
        border-color: #80bdff;
        box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25);
    }
    
    select.form-control {
        cursor: pointer;
    }
    
    .alert-info {
        background-color: #d1ecf1;
        border-color: #bee5eb;
        color: #0c5460;
    }
</style>

{% endblock %}
