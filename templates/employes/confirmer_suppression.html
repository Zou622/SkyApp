{% extends 'main.html' %}
{% load static %}

{% block contenu %}
<div class="content-wrapper">
    <div class="container mt-4">
        <div class="card shadow border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-exclamation-triangle me-2"></i> Confirmer la suppression</h4>
            </div>
            <div class="card-body">
                <div class="alert alert-warning mb-4" role="alert">
                    <i class="fas fa-info-circle me-2"></i>
                    <strong>Attention :</strong> Êtes-vous sûr de vouloir supprimer ce {{ type }} ? Cette action est irréversible.
                </div>

                <div class="card bg-light mb-4">
                    <div class="card-body">
                        <h5 class="card-title">{{ objet.nom }}</h5>
                        <p class="text-muted mb-0">ID : <strong>{{ objet.id }}</strong></p>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{% url retour_url %}" class="btn btn-secondary">
                        <i class="fas fa-arrow-left me-2"></i> Annuler
                    </a>
                    <form method="post" action="" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-2"></i> Supprimer définitivement
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
